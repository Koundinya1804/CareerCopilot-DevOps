
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careercopilot-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend-network

networks:
  backend-network:
    external: true
    name: careercopilot-backend_careercopilot
