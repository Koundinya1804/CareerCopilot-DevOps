server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively; never cache index.html so
    # deploys are picked up immediately instead of being stuck behind a
    # stale cached shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy API calls to the backend container so the frontend can
    # use a same-origin relative base URL (VITE_API_BASE_URL=/api/v1) and
    # avoid CORS entirely in production. Adjust the upstream host/port to
    # match your docker-compose service name / deployment target.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (agent chat streaming) needs buffering disabled and a longer
        # read timeout, or nginx will buffer/chunk the stream and the
        # frontend's token-by-token rendering will arrive in bursts instead
        # of smoothly, or time out on long-running agent turns.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # SPA fallback — client-side routing (React Router) needs every
    # unmatched path to serve index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
